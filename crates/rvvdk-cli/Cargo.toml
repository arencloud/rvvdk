[package]
name = "rvvdk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rvddk"
path = "src/main.rs"

[dependencies]
rvvdk-vmdk = { path = "../rvvdk-vmdk" }
rvvdk-core = { path = "../rvvdk-core" }
rvvdk-datamover = { path = "../rvvdk-datamover" }
rvvdk-local = { path = "../rvvdk-local" }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.189"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "preview"
harness = false

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "vmdk"
harness = false

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "parents"
harness = false

[[bench]]
name = "stream"
harness = false
