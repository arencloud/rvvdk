[package]
name = "rvvdk-vsphere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["std", "ring", "tls12"] }
roxmltree = "=0.21.1"
sha2 = "=0.11.0"
sha1 = "=0.11.0"
serde_json = "1.0.151"
zeroize = "=1.9.0"
tokio = { version = "=1.53.1", features = ["rt", "time", "fs", "io-util", "macros", "sync", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.8.2"
rcgen = "=0.14.10"
rpassword = "=7.5.4"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
libc = "0.2.189"

[[bench]]
name = "contract"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
rvvdk-core = { path = "../rvvdk-core" }
rvvdk-local = { path = "../rvvdk-local" }
rvvdk-vmdk = { path = "../rvvdk-vmdk" }
