[package]
name = "rvvdk-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
rvvdk-core = { path = "../crates/rvvdk-core" }
rvvdk-vmdk = { path = "../crates/rvvdk-vmdk" }

[profile.release]
overflow-checks = true

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain"
path = "fuzz_targets/chain.rs"
test = false
doc = false
bench = false
